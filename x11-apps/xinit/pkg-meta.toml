name = "xinit"
version = "1.4.4"
category = "x11-apps"

[dependencies]
link = ["libX11"]
runtime = ["glibc", "libX11", "xauth", "xorg-server", "util-linux"]
build = ["xorgproto", "pkgconf", "linux-headers"]

[[source]]
url = "https://www.x.org/releases/individual/app/xinit-1.4.4.tar.xz"
sha256 = "40a47c7a164c7f981ce3787b4b37f7e411fb43231dcde543d70094075dacfef9"

[build]
system = "autotools"
configure_args = ["--sysconfdir=/etc", "MCOOKIE=/usr/bin/mcookie"]
