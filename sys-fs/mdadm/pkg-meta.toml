name = "mdadm"
version = "4.4"
category = "sys-fs"

[dependencies]
link = ["eudev"]
runtime = ["glibc", "eudev"]
build = ["pkgconf", "linux-headers"]

[[source]]
url = "https://cdn.kernel.org/pub/linux/utils/raid/mdadm/mdadm-4.4.tar.xz"
sha256 = "9b488f35ed153df99924b5fe41eed380e8512de8f18a118628cacdd681b1d573"

[build]
system = "custom"

[scripts]
build = '''
tar xJf mdadm-4.4.tar.xz
make -C mdadm-4.4 BINDIR=/usr/sbin CHECK_RUN_DIR=0 \
    COROSYNC=-DNO_COROSYNC DLM=-DNO_DLM \
    CXFLAGS="-O2 -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE -Wno-error=implicit-fallthrough -Wno-error=unterminated-string-initialization" \
    PKG_CONFIG=/pkg/deps/pkgconf/usr/bin/pkg-config
'''
install = '''
make -C mdadm-4.4 BINDIR=/usr/sbin UDEVDIR=/usr/lib/udev CHECK_RUN_DIR=0 \
    DESTDIR="$PKGDIR" install-bin install-udev
'''
