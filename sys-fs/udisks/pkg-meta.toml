name = "udisks"
version = "2.12.0"
category = "sys-fs"

[dependencies]
link = ["glib", "polkit", "libgudev", "libblockdev", "util-linux", "eudev"]
runtime = ["glibc", "glib", "polkit", "libgudev", "libblockdev", "util-linux", "eudev", "dbus", "mdadm", "e2fsprogs"]
build = ["pkgconf", "gettext", "glib"]

[[source]]
url = "https://github.com/storaged-project/udisks/releases/download/udisks-2.12.0/udisks-2.12.0.tar.bz2"
sha256 = "dd709167fddf07b14f8175dbb3ab0c372147f66b437cc2341a9f97d79303c71f"

[build]
system = "custom"

[scripts]
build = '''
tar xjf udisks-2.12.0.tar.bz2
cd udisks-2.12.0
# There is no configure switch for session libraries. Force their results
# negative so a host pkg-config can never enable logind or elogind.
sed -i -e 's/have_libsystemd_login=yes/have_libsystemd_login=no/g' \
    -e 's/have_libelogind=yes/have_libelogind=no/g' configure
export PATH="/pkg/deps/pkgconf/usr/bin:/pkg/deps/gettext/usr/bin:/pkg/deps/glib/usr/bin:$PATH"
./configure --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --localstatedir=/var \
    --disable-static --disable-gtk-doc --disable-man --disable-introspection \
    --enable-daemon --enable-smart --disable-acl --disable-nls \
    --disable-lvm2 --disable-iscsi --disable-btrfs --disable-lsm \
    --with-udevdir=/usr/lib/udev \
    --with-systemdsystemunitdir=no --with-tmpfilesdir=no \
    --with-modloaddir=/usr/lib/modules-load.d --with-modprobedir=/usr/lib/modprobe.d \
    LIBSYSTEMD_LOGIN_CFLAGS= LIBSYSTEMD_LOGIN_LIBS= \
    LIBELOGIND_CFLAGS= LIBELOGIND_LIBS=
make
'''
install = '''
make -C udisks-2.12.0 DESTDIR="$PKGDIR" install
sed -i '/^SystemdService=/d' "$PKGDIR/usr/share/dbus-1/system-services/org.freedesktop.UDisks2.service"

mkdir -p "$PKGDIR/etc/init.d"
cat > "$PKGDIR/etc/init.d/udisks" <<'EOF'
#!/sbin/openrc-run

supervisor=supervise-daemon
description="UDisks storage daemon"
command="/usr/libexec/udisksd"

depend() {
	need dbus
	after udev
}

start_pre() {
	checkpath -q -d -m 0755 /run/media
}
EOF
chmod 0755 "$PKGDIR/etc/init.d/udisks"
'''
