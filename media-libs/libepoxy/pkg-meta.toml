name = "libepoxy"
version = "1.5.10"
category = "media-libs"

[dependencies]
link = ["libX11", "libglvnd"]
runtime = ["glibc", "libX11", "libglvnd"]
build = ["meson", "ninja", "python3", "pkgconf", "xorgproto"]

[[source]]
url = "https://download.gnome.org/sources/libepoxy/1.5/libepoxy-1.5.10.tar.xz"
sha256 = "072cda4b59dd098bba8c2363a6247299db1fa89411dc221c8b81b8ee8192e623"

[build]
system = "meson"
configure_args = ["-Dx11=true", "-Dglx=yes", "-Degl=yes", "-Ddocs=false", "-Dtests=false"]
