name = "mesa"
version = "24.3.4"
category = "media-libs"

[dependencies]
link = ["gcc", "libglvnd", "libdrm", "expat", "zlib", "zstd", "libX11", "libXext", "libXfixes", "libXrandr", "libXxf86vm", "libxcb", "libxshmfence"]
runtime = ["glibc", "gcc", "libglvnd", "libdrm", "expat", "zlib", "zstd", "libX11", "libXext", "libXfixes", "libXrandr", "libXxf86vm", "libxcb", "libxshmfence"]
build = ["meson", "ninja", "python3", "mako", "markupsafe", "packaging", "pyyaml", "pkgconf", "bison", "flex", "xorgproto", "linux-headers"]

[[source]]
url = "https://archive.mesa3d.org/mesa-24.3.4.tar.xz"
sha256 = "e641ae27191d387599219694560d221b7feaa91c900bcec46bf444218ed66025"

[build]
system = "custom"

[scripts]
build = '''
tar xJf mesa-24.3.4.tar.xz
export PATH="/pkg/deps/meson/usr/bin:/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:/pkg/deps/pkgconf/usr/bin:$PATH"
export PYTHONPATH="/pkg/deps/mako/usr/lib/python3.13/site-packages:/pkg/deps/markupsafe/usr/lib/python3.13/site-packages:/pkg/deps/packaging/usr/lib/python3.13/site-packages:/pkg/deps/pyyaml/usr/lib/python3.13/site-packages"
meson setup mesa-24.3.4 mesa-build \
    --prefix=/usr --libdir=/usr/lib --buildtype=release \
    -Dplatforms=x11 -Degl-native-platform=x11 \
    -Dgallium-drivers=softpipe -Dvulkan-drivers=[] \
    -Dllvm=disabled -Ddraw-use-llvm=false \
    -Dglx=dri -Degl=enabled -Dgbm=enabled -Dglvnd=enabled \
    -Dopengl=true -Dgles1=enabled -Dgles2=enabled \
    -Dgallium-vdpau=disabled -Dgallium-va=disabled \
    -Dgallium-opencl=disabled -Dgallium-rusticl=false \
    -Dbuild-tests=false -Denable-glcpp-tests=false \
    -Dvalgrind=disabled -Dlibunwind=disabled -Dlmsensors=disabled
ninja -C mesa-build
'''
install = '''
export PATH="/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:$PATH"
DESTDIR="$PKGDIR" ninja -C mesa-build install
'''
