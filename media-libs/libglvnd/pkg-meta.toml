name = "libglvnd"
version = "1.7.0"
category = "media-libs"

[dependencies]
link = ["libX11", "libXext", "libxcb"]
runtime = ["glibc", "libX11", "libXext", "libxcb"]
build = ["meson", "ninja", "python3", "pkgconf", "xorgproto"]

[[source]]
url = "https://gitlab.freedesktop.org/glvnd/libglvnd/-/archive/v1.7.0/libglvnd-v1.7.0.tar.gz"
sha256 = "2b6e15b06aafb4c0b6e2348124808cbd9b291c647299eaaba2e3202f51ff2f3d"

[build]
system = "meson"
configure_args = ["-Dx11=enabled", "-Dglx=enabled", "-Degl=true", "-Dgles1=true", "-Dgles2=true", "-Dheaders=true"]
