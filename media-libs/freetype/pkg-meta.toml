name = "freetype"
version = "2.13.3"
category = "media-libs"

[dependencies]
link = ["zlib", "bzip2", "libpng"]
runtime = ["glibc", "zlib", "bzip2", "libpng"]
build = ["pkgconf"]

[[source]]
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz"
sha256 = "0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289"

[build]
system = "autotools"
configure_args = ["--disable-static", "--enable-freetype-config", "--with-zlib=yes", "--with-bzip2=yes", "--with-png=yes", "--with-harfbuzz=no", "--with-brotli=no", "--with-librsvg=no"]
