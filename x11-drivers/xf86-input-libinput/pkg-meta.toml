name = "xf86-input-libinput"
version = "1.5.0"
category = "x11-drivers"

[dependencies]
link = ["libinput", "eudev"]
runtime = ["glibc", "libinput", "eudev", "xorg-server"]
build = ["xorg-server", "xorgproto", "pkgconf"]

[[source]]
url = "https://www.x.org/releases/individual/driver/xf86-input-libinput-1.5.0.tar.xz"
sha256 = "2524c35f196554ea11aef3bba1cf324759454e1d49f98ac026ace2f6003580e6"

[build]
system = "autotools"
configure_args = ["--disable-static", "--with-sdkdir=/usr/include/xorg"]
