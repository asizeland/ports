name = "libwnck"
version = "43.3"
category = "x11-libs"

[dependencies]
link = ["at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "pango", "libX11", "libXres", "libXi", "libXrender", "startup-notification"]
runtime = ["glibc", "at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "pango", "libX11", "libXres", "libXi", "libXrender", "startup-notification"]
build = ["meson", "ninja", "python3", "pkgconf", "gettext", "xorgproto"]

[[source]]
url = "https://download.gnome.org/sources/libwnck/43/libwnck-43.3.tar.xz"
sha256 = "6af8ac41a8f067ade1d3caaed254a83423b5f61ad3f7a460fcacbac2e192bdf7"

[build]
system = "meson"
configure_args = ["-Dstartup_notification=enabled", "-Dintrospection=disabled", "-Dgtk_doc=false", "-Ddeprecation_flags=false", "-Dinstall_tools=true"]
