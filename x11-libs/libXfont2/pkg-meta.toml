name = "libXfont2"
version = "2.0.7"
category = "x11-libs"

[dependencies]
link = ["freetype", "libfontenc", "zlib", "bzip2"]
runtime = ["glibc", "freetype", "libfontenc", "zlib", "bzip2"]
build = ["xorgproto", "xtrans", "pkgconf"]

[[source]]
url = "https://www.x.org/releases/individual/lib/libXfont2-2.0.7.tar.xz"
sha256 = "8b7b82fdeba48769b69433e8e3fbb984a5f6bf368b0d5f47abeec49de3e58efb"

[build]
system = "autotools"
configure_args = ["--disable-static", "--with-freetype", "--with-bzip2"]
