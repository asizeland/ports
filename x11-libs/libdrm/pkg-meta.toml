name = "libdrm"
version = "2.4.124"
category = "x11-libs"

[dependencies]
link = ["libpciaccess"]
runtime = ["glibc", "libpciaccess"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://dri.freedesktop.org/libdrm/libdrm-2.4.124.tar.xz"
sha256 = "ac36293f61ca4aafaf4b16a2a7afff312aa4f5c37c9fbd797de9e3c0863ca379"

[build]
system = "meson"
configure_args = ["-Dintel=enabled", "-Dradeon=disabled", "-Damdgpu=disabled", "-Dnouveau=disabled", "-Dvmwgfx=disabled", "-Dvc4=disabled", "-Detnaviv=disabled", "-Dfreedreno=disabled", "-Dcairo-tests=disabled", "-Dman-pages=disabled", "-Dvalgrind=disabled", "-Dtests=false", "-Dudev=false"]
