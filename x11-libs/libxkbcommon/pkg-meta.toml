name = "libxkbcommon"
version = "1.7.0"
category = "x11-libs"

[dependencies]
link = ["libxcb", "libxml2"]
runtime = ["glibc", "libxcb", "libxml2", "xkeyboard-config"]
build = ["meson", "ninja", "python3", "pkgconf", "bison", "flex", "libxml2", "xkeyboard-config", "xorgproto"]

[[source]]
url = "https://xkbcommon.org/download/libxkbcommon-1.7.0.tar.xz"
sha256 = "65782f0a10a4b455af9c6baab7040e2f537520caa2ec2092805cdfd36863b247"

[build]
system = "meson"
configure_args = ["-Dxkb-config-root=/usr/share/X11/xkb", "-Dx-locale-root=/usr/share/X11/locale", "-Denable-x11=true", "-Denable-wayland=false", "-Denable-tools=true", "-Denable-docs=false", "-Denable-xkbregistry=true"]
