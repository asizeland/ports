name = "elfutils"
version = "0.195"
category = "dev-libs"

[dependencies]
link = ["glibc", "gcc", "zlib"]
runtime = ["glibc", "gcc", "zlib"]
build = ["gcc", "make", "linux-headers", "pkgconf"]

[[source]]
url = "https://sourceware.org/elfutils/ftp/0.195/elfutils-0.195.tar.bz2"
sha256 = "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"

[build]
system = "custom"

[scripts]
build = '''
tar xjf elfutils-0.195.tar.bz2
cd elfutils-0.195
export PATH="/pkg/deps/pkgconf/usr/bin:$PATH"
./configure --prefix=/usr --libdir=/usr/lib \
    --disable-debuginfod --disable-libdebuginfod \
    --without-bzlib --without-lzma --without-zstd
make
'''
install = '''
make -C elfutils-0.195 DESTDIR="$PKGDIR" install
'''
