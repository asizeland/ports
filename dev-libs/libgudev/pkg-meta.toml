name = "libgudev"
version = "238"
category = "dev-libs"

[dependencies]
link = ["glib", "eudev"]
runtime = ["glibc", "glib", "eudev"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://download.gnome.org/sources/libgudev/238/libgudev-238.tar.xz"
sha256 = "61266ab1afc9d73dbc60a8b2af73e99d2fdff47d99544d085760e4fa667b5dd1"

[build]
system = "meson"
configure_args = ["--libdir=/usr/lib", "-Dtests=disabled", "-Dintrospection=disabled", "-Dvapi=disabled", "-Dgtk_doc=false"]
