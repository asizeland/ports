name = "libinput"
version = "1.28.1"
category = "dev-libs"

[dependencies]
link = ["eudev", "libevdev", "mtdev"]
runtime = ["glibc", "eudev", "libevdev", "mtdev"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.28.1/libinput-1.28.1.tar.gz"
sha256 = "a13f8c9a7d93df3c85c66afd135f0296701d8d32f911991b7aa4273fdd6a42a3"

[build]
system = "meson"
configure_args = ["-Dudev-dir=/usr/lib/udev", "-Dlibwacom=false", "-Ddebug-gui=false", "-Dtests=false", "-Ddocumentation=false", "-Dzshcompletiondir=no"]
