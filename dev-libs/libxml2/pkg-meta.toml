name = "libxml2"
version = "2.14.5"
category = "dev-libs"

[dependencies]
link = ["zlib"]
runtime = ["glibc", "zlib"]
build = ["pkgconf"]

[[source]]
url = "https://download.gnome.org/sources/libxml2/2.14/libxml2-2.14.5.tar.xz"
sha256 = "03d006f3537616833c16c53addcdc32a0eb20e55443cba4038307e3fa7d8d44b"

[build]
system = "autotools"
configure_args = ["--disable-static", "--with-zlib", "--without-lzma", "--without-python", "--without-debug", "--without-coverage"]
