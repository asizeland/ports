name = "garcon"
version = "4.20.0"
category = "xfce-base"

[dependencies]
link = ["at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "harfbuzz", "pango", "libxfce4util", "libxfce4ui"]
runtime = ["glibc", "at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "harfbuzz", "pango", "libxfce4util", "libxfce4ui", "shared-mime-info"]
build = ["pkgconf", "gettext", "linux-headers", "xorgproto"]

[hooks]
operations = ["icon-cache"]

[[source]]
url = "https://archive.xfce.org/src/xfce/garcon/4.20/garcon-4.20.0.tar.bz2"
sha256 = "7fb8517c12309ca4ddf8b42c34bc0c315e38ea077b5442bfcc4509415feada8f"

[build]
system = "autotools"
configure_args = ["--sysconfdir=/etc", "--disable-static", "--disable-gtk-doc", "--disable-introspection", "--disable-vala"]
