name = "xfce4-notifyd"
version = "0.9.7"
category = "xfce-base"

[dependencies]
link = ["at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "harfbuzz", "pango", "libnotify", "xfce4-panel", "libxfce4util", "libxfce4ui", "xfconf", "sqlite", "dbus", "libX11"]
runtime = ["glibc", "at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "harfbuzz", "pango", "libnotify", "xfce4-panel", "libxfce4util", "libxfce4ui", "xfconf", "sqlite", "dbus", "libX11", "desktop-file-utils"]
build = ["pkgconf", "gettext", "xorgproto", "python3", "linux-headers"]

[hooks]
operations = ["icon-cache", "desktop-database"]

[[source]]
url = "https://archive.xfce.org/src/apps/xfce4-notifyd/0.9/xfce4-notifyd-0.9.7.tar.bz2"
sha256 = "170d18fd5f40cce823ffc7ae3d7e21644007c3f45808ab4835f0401d21b3516a"

[build]
system = "autotools"
configure_args = ["--sysconfdir=/etc", "--disable-static", "--enable-x11", "--disable-wayland", "--disable-sound", "--disable-systemd", "--enable-dbus-start-daemon", "--enable-xdg-autostart"]
