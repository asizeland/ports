name = "libxfce4ui"
version = "4.20.2"
category = "xfce-base"

[dependencies]
link = ["glib", "gtk3", "libxfce4util", "xfconf", "libX11", "libICE", "libSM", "startup-notification"]
runtime = ["glibc", "glib", "gtk3", "libxfce4util", "xfconf", "libX11", "libICE", "libSM", "startup-notification", "desktop-file-utils"]
build = ["pkgconf", "gettext", "xorgproto"]

[hooks]
operations = ["icon-cache", "desktop-database"]

[[source]]
url = "https://archive.xfce.org/src/xfce/libxfce4ui/4.20/libxfce4ui-4.20.2.tar.bz2"
sha256 = "5d3d67b1244a10cee0e89b045766c05fe1035f7938f0410ac6a3d8222b5df907"

[build]
system = "autotools"
configure_args = ["--sysconfdir=/etc", "--disable-static", "--enable-x11", "--disable-wayland", "--enable-libsm", "--enable-startup-notification", "--disable-glibtop", "--disable-epoxy", "--disable-gudev", "--disable-gladeui2", "--enable-keyboard-library", "--disable-introspection", "--disable-vala", "--disable-gtk-doc", "--disable-tests"]
