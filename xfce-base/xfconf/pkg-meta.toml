name = "xfconf"
version = "4.20.0"
category = "xfce-base"

[dependencies]
link = ["glib", "libxfce4util"]
runtime = ["glibc", "glib", "libxfce4util", "dbus"]
build = ["pkgconf", "gettext", "python3"]

[[source]]
url = "https://archive.xfce.org/src/xfce/xfconf/4.20/xfconf-4.20.0.tar.bz2"
sha256 = "8bc43c60f1716b13cf35fc899e2a36ea9c6cdc3478a8f051220eef0f53567efd"

[build]
system = "autotools"
configure_args = ["--sysconfdir=/etc", "--disable-static", "--disable-gtk-doc", "--disable-introspection", "--disable-vala", "--disable-gsettings-backend", "--disable-checks", "--disable-profiling"]
