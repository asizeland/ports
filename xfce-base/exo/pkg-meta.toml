name = "exo"
version = "4.20.0"
category = "xfce-base"

[dependencies]
link = ["at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "harfbuzz", "pango", "libxfce4util", "libxfce4ui"]
runtime = ["glibc", "at-spi2-core", "cairo", "gdk-pixbuf", "glib", "gtk3", "harfbuzz", "pango", "libxfce4util", "libxfce4ui", "shared-mime-info"]
build = ["pkgconf", "gettext", "linux-headers", "xorgproto"]

[[source]]
url = "https://archive.xfce.org/src/xfce/exo/4.20/exo-4.20.0.tar.bz2"
sha256 = "4277f799245f1efde01cd917fd538ba6b12cf91c9f8a73fe2035fd5456ec078d"

[build]
system = "autotools"
configure_args = ["--sysconfdir=/etc", "--disable-static", "--enable-gio-unix", "--disable-gtk-doc"]
