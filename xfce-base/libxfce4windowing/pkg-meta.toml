name = "libxfce4windowing"
version = "4.20.7"
category = "xfce-base"

[dependencies]
link = ["glib", "gtk3", "gdk-pixbuf", "libX11", "libXrandr", "libwnck", "libdisplay-info"]
runtime = ["glibc", "glib", "gtk3", "gdk-pixbuf", "libX11", "libXrandr", "libwnck", "libdisplay-info"]
build = ["pkgconf", "gettext", "xorgproto"]

[[source]]
url = "https://archive.xfce.org/src/xfce/libxfce4windowing/4.20/libxfce4windowing-4.20.7.tar.bz2"
sha256 = "01320b279648ab5b13263f8d260bc5958be599e1eaac77c4503598dfcf96c8bb"

[build]
system = "autotools"
configure_args = ["--sysconfdir=/etc", "--disable-static", "--enable-x11", "--disable-wayland", "--disable-tests", "--disable-gtk-doc", "--disable-introspection", "--disable-vala"]
