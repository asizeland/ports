name = "pyyaml"
version = "6.0.2"
category = "dev-python"

[dependencies]
runtime = ["python3"]
build = ["python3"]

[[source]]
url = "https://files.pythonhosted.org/packages/source/p/pyyaml/pyyaml-6.0.2.tar.gz"
sha256 = "d584d9ec91ad65861cc08d42e834324ef890a082e591037abe114850ff7bbc3e"

[build]
system = "custom"

[scripts]
build = '''
tar xzf pyyaml-6.0.2.tar.gz
'''
install = '''
DEST="$PKGDIR/usr/lib/python3.13/site-packages"
mkdir -p "$DEST"
cp -r pyyaml-6.0.2/lib/yaml "$DEST/"
python3 -m compileall -q "$DEST/yaml"
'''
