name = "keyutils"
version = "1.6.3"
category = "sys-apps"

[dependencies]
runtime = ["glibc"]
build = ["linux-headers"]

[[source]]
url = "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/snapshot/keyutils-1.6.3.tar.gz"
sha256 = "a61d5706136ae4c05bd48f86186bcfdbd88dd8bd5107e3e195c924cfc1b39bb4"

[build]
system = "custom"

[scripts]
build = '''
tar xzf keyutils-1.6.3.tar.gz
make -C keyutils-1.6.3 LIBDIR=/usr/lib USRLIBDIR=/usr/lib \
    NO_ARLIB=1 CFLAGS="-O2 -fPIC" CXXFLAGS="-O2"
'''
install = '''
make -C keyutils-1.6.3 LIBDIR=/usr/lib USRLIBDIR=/usr/lib \
    BINDIR=/usr/bin SBINDIR=/usr/sbin NO_ARLIB=1 DESTDIR="$PKGDIR" install
ln -sfn libkeyutils.so.1 "$PKGDIR/usr/lib/libkeyutils.so"
'''
