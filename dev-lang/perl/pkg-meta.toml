name = "perl"
version = "5.42.0"
category = "dev-lang"

[[source]]
url = "https://www.cpan.org/src/5.0/perl-5.42.0.tar.gz"
sha256 = "e093ef184d7f9a1b9797e2465296f55510adb6dab8842b0c3ed53329663096dc"

[dependencies]
link = ["libxcrypt"]
runtime = ["glibc", "libxcrypt"]

[build]
system = "custom"

[scripts]
build = '''
tar xzf perl-5.42.0.tar.gz
cd perl-5.42.0
./Configure -des \
    -Dprefix=/usr \
    -Dvendorprefix=/usr \
    -Dsiteprefix=/usr/local \
    -Dnoextensions='DB_File GDBM_File NDBM_File ODBM_File' \
    -Dman1dir=/usr/share/man/man1 \
    -Dman3dir=/usr/share/man/man3
make
'''
install = '''
make -C perl-5.42.0 DESTDIR="$PKGDIR" install
'''
