name = "libnvme"
version = "1.16.2"
category = "sys-libs"

[dependencies]
link = ["json-c", "openssl", "keyutils"]
runtime = ["glibc", "json-c", "openssl", "keyutils"]
build = ["meson", "ninja", "python3", "pkgconf"]

[[source]]
url = "https://github.com/linux-nvme/libnvme/archive/refs/tags/v1.16.2/libnvme-1.16.2.tar.gz"
sha256 = "1d850d5a871559abf641d6e6b63bb86047e4cb26f3ad144597c2c64b3cff7231"

[build]
system = "custom"

[scripts]
build = '''
tar xzf libnvme-1.16.2.tar.gz
export PATH="/pkg/deps/meson/usr/bin:/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:/pkg/deps/pkgconf/usr/bin:$PATH"
meson setup libnvme-1.16.2 libnvme-build \
    --prefix=/usr --libdir=/usr/lib --sysconfdir=/etc --buildtype=release \
    -Ddocs=false -Ddocs-build=false -Dexamples=false -Dtests=false \
    -Dpython=disabled -Dopenssl=enabled -Djson-c=enabled -Dkeyutils=enabled \
    -Dlibdbus=disabled -Dliburing=disabled
ninja -C libnvme-build
'''
install = '''
export PATH="/pkg/deps/ninja/usr/bin:/pkg/deps/python3/usr/bin:$PATH"
DESTDIR="$PKGDIR" ninja -C libnvme-build install
'''
